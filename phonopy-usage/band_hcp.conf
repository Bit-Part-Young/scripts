# 用法：phonopy --config band_hcp.conf -s
# 不写 DIM：超胞从 phonopy_disp.yaml 读取
# BAND 为原胞倒格矢下的分数坐标（phonon_vasp.sh / disp_supercell_generation.py 使用 spglib 标准原胞），与 plot_phonon_bs.py 的预设一致
# hcp：a、b 夹角 120°（spglib 标准设定）；60° 设定下 K 点坐标不同

BAND = 0. 0. 0.  0.333333 0.333333 0.  0.5 0. 0.  0. 0. 0.  0. 0. 0.5
# BAND = AUTO
BAND_LABELS = $\Gamma$ K M $\Gamma$ A
BAND_POINTS = 101

BAND_CONNECTION = .TRUE.
FORCE_SETS = READ
# FORCE_CONSTANTS = READ
